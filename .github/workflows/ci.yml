name: ci

# Documentation-only changes do not rebuild anything.
on:
  push:
    branches: [main, experiment/terminal-graphics]
    paths-ignore: &docs
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore: *docs
  workflow_call:
  workflow_dispatch:

# Nothing here needs write access. Declared rather than inherited, so a change
# to the repository default cannot quietly widen what a workflow may do.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Native video previews link FFmpeg and CPAL.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Native media dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang libclang-dev libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev libasound2-dev ffmpeg
      - name: Native media dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config llvm
      - name: Locate libclang (macOS)
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # First, and cheap: Cargo.toml and Cargo.lock must agree.
      - run: ./scripts/check-version.sh
      - run: cargo fmt --check
      # dead_code is allowed rather than denied: the core lands milestone by
      # milestone, complete and tested, ahead of the UI that will reach it.
      # Every other lint is an error.
      # unrar_sys builds bundled C++; Ubuntu build-essential and the macOS
      # Xcode toolchain already provide the required compiler/runtime.
      - run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code
      # Anything that needs a trash daemon running is gated behind
      # STARFOLD_TEST_TRASH.
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  # macOS is a supported target, and most of what breaks there breaks at
  # compile time -- a `cfg` that assumed Linux, a trash backend that is not
  # selected, a path that assumed XDG -- so a build is most of the value.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: Native media dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang libclang-dev libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev libasound2-dev ffmpeg
      - name: Native media dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config llvm
      - name: Locate libclang (macOS)
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # unrar_sys builds bundled C++; Ubuntu build-essential and the macOS
      # Xcode toolchain already provide the required compiler/runtime.
      - run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  # What the dependency tree is carrying, which nobody notices by reading it.
  # Two questions: is anything under a known advisory, and is anything under a
  # licence this cannot ship. See `deny.toml` for what is allowed and why.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  msrv:
    # rust-version in Cargo.toml is a promise; this is what makes it true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.90"
      - name: Native media dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang libclang-dev libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev libasound2-dev ffmpeg
      - name: Native media dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config llvm
      - name: Locate libclang (macOS)
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all-targets --all-features

  graphical-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Native media dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang libclang-dev libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev libasound2-dev ffmpeg
      - name: Native media dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config llvm
      - name: Locate libclang (macOS)
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: cargo build --features terminal-graphics
      - run: python3 scripts/test-graphical-ssh.py --binary target/debug/starfold --rtt-ms 50 --bandwidth-mbps 10
