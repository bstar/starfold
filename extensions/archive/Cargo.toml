[package]
name = "starfold-archive"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
starfold-archive-protocol = { version = "0.1", path = "../archive-protocol" }
anyhow = "1"
serde_json = "1"
tempfile = "3"
libc = "0.2"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rust2 = "0.21"
bzip2 = "0.6"
ruzstd = "0.9"
zstd = { version = "0.13", default-features = false }
sevenz-rust2 = "=0.20.2"
unrar_sys = "0.5.8"

[dev-dependencies]
tempfile = "3"
