[package]
name = "starfold-preview-comic"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[dependencies]
anyhow = "1"
starfold-preview-protocol = { version = "0.1", path = "../protocol" }
starfold-archive = { version = "0.1", path = "../archive" }
starkit = { workspace = true, features = ["image", "gif", "bmp", "webp"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
